plugins { id 'com.android.application' }

android {
    namespace 'org.maxbot.app'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'org.maxbot.app'
        minSdk 30
        targetSdk 36
        versionCode 11
        versionName '0.6.1-timing-fix'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.returnDefaultValues = true }
    ndkVersion '28.2.13676358'
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    androidResources { noCompress 'tflite' }
    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation project(':maxbot-core')
    implementation 'com.google.ar:core:1.48.0'
    implementation 'com.google.ai.edge.litert:litert:1.4.2'
    implementation 'com.google.ai.edge.litert:litert-gpu:1.4.2'
    implementation "io.github.webrtc-sdk:android:$webrtc_version"
    implementation 'com.squareup.okhttp3:okhttp:4.9.1'
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'androidx.core:core:1.12.0'
    implementation fileTree(dir: '../comlib/libs', include: ['usbserial*.aar'])
}
tasks.configureEach {
    if (name.startsWith('compile') || name.startsWith('collect')) dependsOn ':comlib:downloadAars'
}

tasks.register('verifyBaselineModel') {
    def baselineFile = file('src/main/assets/maxbot/yolov5n-fp16.tflite')
    def provenanceFile = file('src/main/assets/maxbot/yolov5n-baseline.json')
    inputs.files baselineFile, provenanceFile
    doLast {
        if (!baselineFile.exists() || !provenanceFile.exists()) {
            throw new GradleException('Export the official baseline first: tools/maxbot/export_baseline.py (see docs/autonomy/signal-propagation.md)')
        }
        def provenance = new groovy.json.JsonSlurper().parse(provenanceFile)
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(baselineFile.bytes).encodeHex().toString()
        if (digest != provenance.sha256) throw new GradleException('Bundled YOLOv5n hash differs from its provenance')
    }
}
tasks.named('preBuild') { dependsOn 'verifyBaselineModel' }
