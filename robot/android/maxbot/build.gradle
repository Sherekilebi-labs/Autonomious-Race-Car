plugins { id 'com.android.application' }

android {
    namespace 'org.maxbot.app'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'org.maxbot.app'
        minSdk 30
        targetSdk 36
        versionCode 3
        versionName '0.3.0-task1'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    ndkVersion '28.2.13676358'
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    androidResources { noCompress 'tflite' }
    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    implementation project(':maxbot-core')
    implementation 'com.google.ar:core:1.48.0'
    implementation 'com.google.ai.edge.litert:litert:1.4.2'
    implementation 'com.google.ai.edge.litert:litert-gpu:1.4.2'
    implementation "io.github.webrtc-sdk:android:$webrtc_version"
    implementation 'com.squareup.okhttp3:okhttp:4.9.1'
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'androidx.core:core:1.12.0'
    implementation fileTree(dir: '../comlib/libs', include: ['usbserial*.aar'])
}
tasks.configureEach {
    if (name.startsWith('compile') || name.startsWith('collect')) dependsOn ':comlib:downloadAars'
}
